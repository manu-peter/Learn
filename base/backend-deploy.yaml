apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: backend
        image: manu144/learn:v1
        workingDir: /app
        command: ["node", "server.js"]
        ports:
        - containerPort: 5000
        env:
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: db-name
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        volumeMounts:
        - name: backend-code
          mountPath: /app/server.js
          subPath: server.js
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      volumes:
      - name: backend-code
        configMap:
          name: backend-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 5000

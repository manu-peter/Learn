apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: learn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: install-deps
        image: node:18-alpine
        command: ['sh', '-c', 'cd /app && npm init -y && npm install express pg cors']
        volumeMounts:
        - name: app-volume
          mountPath: /app
      containers:
      - name: backend
        image: node:18-alpine
        workingDir: /app
        command: ["node", "server.js"]
        ports:
        - containerPort: 5000
        env:
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: db-name
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        volumeMounts:
        - name: app-volume
          mountPath: /app
        - name: backend-code
          mountPath: /app/server.js
          subPath: server.js
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      volumes:
      - name: app-volume
        emptyDir: {}
      - name: backend-code
        configMap:
          name: backend-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: learn
spec:
  selector:
    app: backend
  ports:
  - port: 5000

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: postgres-circuit-breaker
  namespace: prod
spec:
  host: postgres
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 5
        connectTimeout: 2s
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 100

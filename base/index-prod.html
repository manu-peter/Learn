<!DOCTYPE html>
<html>
<head>
    <title>TaskFlow Pro | Enterprise</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --text: #2d3436;
            --muted: #636e72;
            --gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 50%, #fd79a8 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108,92,231,0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(253,121,168,0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0,206,201,0.05) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--text);
        }
        .navbar { 
            background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(20px);
            padding: 16px 32px; 
            border-bottom: 1px solid rgba(0,0,0,0.06);
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 12px;
        }
        .logo { 
            font-size: 24px; font-weight: 700; 
            background: var(--gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge { 
            background: var(--gradient); color: white; 
            padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        
        /* Stats Cards */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { 
            background: var(--card); padding: 20px; border-radius: 16px; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .stat-card .num { font-size: 28px; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .stat-card .label { font-size: 11px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .stat-card .icon { width: 40px; height: 40px; border-radius: 12px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; }
        .icon-purple { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }
        .icon-pink { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .icon-teal { background: linear-gradient(135deg, #00cec9, #00b894); }
        .icon-blue { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        
        /* Add Form */
        .add-form { 
            background: var(--card); padding: 28px; border-radius: 20px; 
            margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .add-form h3 { margin-bottom: 16px; color: var(--primary); font-size: 18px; }
        .input-row { display: flex; gap: 12px; }
        .add-form input { 
            flex: 1; padding: 14px 18px; border-radius: 12px; 
            border: 2px solid #e8e8e8; font-size: 15px; transition: border 0.3s, box-shadow 0.3s;
            background: #fafafa;
        }
        .add-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); background: white; }
        .add-form button { 
            padding: 14px 28px; border-radius: 12px; border: none; 
            background: var(--gradient); color: white; font-size: 15px; font-weight: 600; 
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .add-form button:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(108,92,231,0.3); }
        
        /* Task Cards */
        .task-card { 
            background: var(--card); padding: 20px 24px; margin-bottom: 14px; 
            border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            display: flex; align-items: center; gap: 16px;
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid transparent;
        }
        .task-card:hover { 
            transform: translateX(4px); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border-left-color: var(--primary);
        }
        .task-icon { 
            width: 48px; height: 48px; border-radius: 14px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; font-weight: bold; flex-shrink: 0;
        }
        .task-card:nth-child(5n+1) .task-icon { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .task-card:nth-child(5n+2) .task-icon { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .task-card:nth-child(5n+3) .task-icon { background: linear-gradient(135deg, #00cec9, #00b894); }
        .task-card:nth-child(5n+4) .task-icon { background: linear-gradient(135deg, #fdcb6e, #f39c12); }
        .task-card:nth-child(5n+5) .task-icon { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .task-content { flex: 1; }
        .task-content h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .task-content .desc { color: var(--muted); font-size: 13px; }
        .task-content .time { font-size: 11px; color: #b2bec3; margin-top: 4px; }
        .task-arrow { color: #ccc; font-size: 20px; transition: transform 0.3s; }
        .task-card:hover .task-arrow { transform: translateX(4px); color: var(--primary); }
        
        .empty { text-align: center; padding: 60px; color: var(--muted); }
        .empty .big-icon { font-size: 48px; margin-bottom: 16px; }
        .footer { text-align: center; padding: 40px; color: #b2bec3; font-size: 13px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">TaskFlow Pro</div>
        <div class="badge">PRODUCTION</div>
    </div>
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="icon icon-purple">T</div>
                <div class="num" id="totalTasks">0</div>
                <div class="label">Tasks</div>
            </div>
            <div class="stat-card">
                <div class="icon icon-pink">L</div>
                <div class="num" id="latestTask">-</div>
                <div class="label">Latest</div>
            </div>
            <div class="stat-card">
                <div class="icon icon-teal">S</div>
                <div class="num">mTLS</div>
                <div class="label">Security</div>
            </div>
            <div class="stat-card">
                <div class="icon icon-blue">K</div>
                <div class="num">K8s</div>
                <div class="label">Platform</div>
            </div>
        </div>
        <div class="add-form">
            <h3>Create New Task</h3>
            <div class="input-row">
                <input type="text" id="title" placeholder="What needs to be done?">
                <button onclick="addTask()">Add Task</button>
            </div>
        </div>
        <div id="tasks"></div>
    </div>
    <div class="footer">TaskFlow Pro &copy; 2026 | Kubernetes + Istio + ArgoCD</div>
    <script>
        async function loadTasks() {
            const resp = await fetch('/api/tasks');
            const tasks = await resp.json();
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('latestTask').textContent = tasks.length > 0 ? tasks[0].title.substring(0,12) : '-';
            const el = document.getElementById('tasks');
            if (tasks.length === 0) {
                el.innerHTML = '<div class="empty"><div class="big-icon">+</div><h3>No tasks yet</h3><p>Create your first task above!</p></div>';
                return;
            }
            const letters = ['T','A','S','K','F','L','O','W','P','R'];
            el.innerHTML = tasks.map((t, i) => `
                <div class="task-card">
                    <div class="task-icon">${letters[i % letters.length]}</div>
                    <div class="task-content">
                        <h4>${t.title}</h4>
                        <div class="desc">${t.description || 'No description'}</div>
                        <div class="time">${new Date(t.created_at).toLocaleString()}</div>
                    </div>
                    <div class="task-arrow">&gt;</div>
                </div>
            `).join('');
        }
        async function addTask() {
            const title = document.getElementById('title').value;
            if (!title) return;
            await fetch('/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, description: ''})
            });
            document.getElementById('title').value = '';
            loadTasks();
        }
        loadTasks();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Task Manager v2.0</title>
    <style>
        body { font-family: Arial; margin: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .task { border: 1px solid #e0e0e0; padding: 15px; margin: 10px 0; border-radius: 8px; background: #f9f9f9; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { transform: scale(1.05); transition: 0.2s; }
        h1 { color: #333; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Task Manager v2.0</h1>
        <input type="text" id="title" placeholder="Task title">
        <textarea id="description" placeholder="Description" rows="3"></textarea>
        <button onclick="addTask()">Add Task</button>
        <div id="tasks"></div>
    </div>
    <script>
        async function loadTasks() {
            const response = await fetch('/api/tasks');
            const tasks = await response.json();
            document.getElementById('tasks').innerHTML = tasks.map(t => 
                `<div class="task"><strong>${t.title}</strong><br>${t.description || ''}<br><small>${new Date(t.created_at).toLocaleString()}</small></div>`
            ).join('');
        }
        
        async function addTask() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            if (!title) return alert('Title required!');
            await fetch('/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, description})
            });
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            loadTasks();
        }
        
        loadTasks();
    </script>
</body>
</html>

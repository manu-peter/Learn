apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

configMapGenerator:
  - name: nginx-config
    behavior: replace
    files:
      - nginx.conf

secretGenerator:
  - name: db-secret
    behavior: create
    literals:
      - password=password123

patches:
  - path: patch-service.yaml

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2
